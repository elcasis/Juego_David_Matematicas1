<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Las Multiplicaciones de David</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --fondo: #FFF8E7;
            --primario: #FF6B35;
            --secundario: #00B894;
            --acento: #FDCB6E;
            --error: #E17055;
            --texto: #2D3436;
            --texto-claro: #636E72;
            --card: #FFFFFF;
            --sombra: rgba(255, 107, 53, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--fondo);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .fondo-formas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .forma {
            position: absolute;
            border-radius: 50%;
            opacity: 0.12;
            animation: flotar 8s ease-in-out infinite;
        }

        .forma:nth-child(1) { width: 200px; height: 200px; background: var(--primario); top: -50px; left: -40px; }
        .forma:nth-child(2) { width: 150px; height: 150px; background: var(--secundario); top: 30%; right: -30px; animation-delay: -2s; animation-duration: 10s; }
        .forma:nth-child(3) { width: 120px; height: 120px; background: var(--acento); bottom: 10%; left: 10%; animation-delay: -4s; animation-duration: 12s; }
        .forma:nth-child(4) { width: 180px; height: 180px; background: var(--error); bottom: -40px; right: 15%; animation-delay: -1s; animation-duration: 9s; }
        .forma:nth-child(5) { width: 90px; height: 90px; background: var(--primario); top: 50%; left: 50%; animation-delay: -3s; animation-duration: 11s; }

        @keyframes flotar {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            25% { transform: translateY(-30px) rotate(5deg) scale(1.05); }
            50% { transform: translateY(15px) rotate(-3deg) scale(0.95); }
            75% { transform: translateY(-20px) rotate(4deg) scale(1.02); }
        }

        .contenedor {
            position: relative;
            z-index: 1;
            max-width: 520px;
            margin: 0 auto;
            padding: 24px 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .titulo {
            font-family: 'Fredoka One', cursive;
            font-size: 2rem;
            color: var(--primario);
            text-align: center;
            margin-bottom: 6px;
            text-shadow: 2px 2px 0px rgba(255, 107, 53, 0.15);
            letter-spacing: 1px;
        }

        .subtitulo {
            font-size: 0.95rem;
            color: var(--texto-claro);
            text-align: center;
            margin-bottom: 24px;
            font-weight: 700;
        }

        .barra-contenedor { width: 100%; margin-bottom: 28px; }

        .barra-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .barra-label { font-weight: 900; font-size: 0.9rem; color: var(--texto); }
        .barra-numero { font-family: 'Fredoka One', cursive; font-size: 1.1rem; color: var(--primario); }

        .barra-track {
            width: 100%;
            height: 22px;
            background: #EDE8DD;
            border-radius: 11px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.08);
        }

        .barra-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--secundario), #00D2A0);
            border-radius: 11px;
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .barra-fill::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
            animation: brillo 2s ease-in-out infinite;
        }

        @keyframes brillo {
            0% { left: -100%; }
            100% { left: 200%; }
        }

        .estrellas {
            display: flex;
            justify-content: space-between;
            padding: 0 2px;
            margin-top: 6px;
        }

        .estrella {
            font-size: 1rem;
            color: #DDD5C5;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .estrella.conseguida {
            color: var(--acento);
            text-shadow: 0 0 8px rgba(253, 203, 110, 0.5);
            transform: scale(1.3);
        }

        .tarjeta {
            width: 100%;
            background: var(--card);
            border-radius: 24px;
            padding: 36px 28px 32px;
            box-shadow: 0 8px 32px var(--sombra), 0 2px 8px rgba(0,0,0,0.04);
            text-align: center;
            border: 3px solid transparent;
            transition: border-color 0.3s, transform 0.3s;
        }

        .tarjeta.correcta {
            border-color: var(--secundario);
            animation: sacudirBien 0.5s ease;
        }

        .tarjeta.incorrecta {
            border-color: var(--error);
            animation: sacudirMal 0.5s ease;
        }

        @keyframes sacudirBien {
            0%, 100% { transform: scale(1); }
            30% { transform: scale(1.03); }
            60% { transform: scale(0.98); }
        }

        @keyframes sacudirMal {
            0%, 100% { transform: translateX(0); }
            15% { transform: translateX(-10px); }
            30% { transform: translateX(10px); }
            45% { transform: translateX(-8px); }
            60% { transform: translateX(8px); }
            75% { transform: translateX(-4px); }
            90% { transform: translateX(4px); }
        }

        .pregunta-label {
            font-size: 0.85rem;
            color: var(--texto-claro);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .pregunta {
            font-family: 'Fredoka One', cursive;
            font-size: 3.5rem;
            color: var(--texto);
            line-height: 1.1;
            margin-bottom: 32px;
        }

        .pregunta .signo { color: var(--primario); margin: 0 6px; }
        .pregunta .igual { color: var(--secundario); margin: 0 6px; }

        .pregunta .interrogacion {
            display: inline-block;
            color: var(--acento);
            animation: latir 1.2s ease-in-out infinite;
        }

        @keyframes latir {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .opciones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .opcion {
            font-family: 'Fredoka One', cursive;
            font-size: 1.6rem;
            color: var(--texto);
            background: var(--fondo);
            border: 3px solid #EDE8DD;
            border-radius: 16px;
            padding: 18px 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .opcion:hover:not(.desactivada) {
            border-color: var(--primario);
            background: #FFF3EA;
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(255, 107, 53, 0.15);
        }

        .opcion:active:not(.desactivada) { transform: translateY(0); }

        .opcion.elegida-correcta {
            background: var(--secundario);
            color: white;
            border-color: var(--secundario);
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(0, 184, 148, 0.4);
        }

        .opcion.elegida-incorrecta {
            background: var(--error);
            color: white;
            border-color: var(--error);
            opacity: 0.7;
        }

        .opcion.mostrar-correcta {
            border-color: var(--secundario);
            background: #E8FFF7;
        }

        .opcion.desactivada { cursor: default; opacity: 0.5; }
        .opcion.mostrar-correcta.desactivada { opacity: 1; }
        .opcion.elegida-correcta.desactivada { opacity: 1; }

        .icono-resultado {
            font-size: 1rem;
            display: none;
        }

        .opcion.elegida-correcta .icono-resultado,
        .opcion.elegida-incorrecta .icono-resultado,
        .opcion.mostrar-correcta .icono-resultado {
            display: inline;
        }

        .feedback {
            margin-top: 20px;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 900;
            font-size: 1.1rem;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }

        .feedback.visible { opacity: 1; transform: translateY(0); }
        .feedback.bien { color: var(--secundario); }
        .feedback.mal { color: var(--error); }

        .racha {
            margin-top: 12px;
            text-align: center;
            font-weight: 900;
            font-size: 0.95rem;
            color: var(--primario);
            opacity: 0;
            transition: opacity 0.4s;
            min-height: 24px;
        }
        .racha.visible { opacity: 1; }

        .contador-errores {
            margin-top: 8px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--texto-claro);
            font-weight: 700;
            min-height: 20px;
        }

        .victoria-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .victoria-overlay.mostrar {
            display: flex;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .victoria-card {
            background: var(--card);
            border-radius: 28px;
            padding: 44px 32px 36px;
            text-align: center;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            animation: zoomIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .victoria-card::before {
            content: '';
            position: absolute;
            top: -3px; left: -3px; right: -3px; bottom: -3px;
            background: linear-gradient(135deg, var(--primario), var(--acento), var(--secundario), var(--primario));
            background-size: 300% 300%;
            border-radius: 30px;
            z-index: -1;
            animation: gradiente 3s ease infinite;
        }

        @keyframes gradiente {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes zoomIn {
            from { transform: scale(0.6); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .victoria-icono {
            font-size: 4rem;
            margin-bottom: 16px;
            display: block;
            animation: rebotar 1s ease infinite;
        }

        @keyframes rebotar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .victoria-titulo {
            font-family: 'Fredoka One', cursive;
            font-size: 1.7rem;
            color: var(--primario);
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .victoria-sub {
            font-size: 1rem;
            color: var(--texto-claro);
            font-weight: 700;
            margin-bottom: 28px;
        }

        .victoria-estrellas {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .victoria-estrellas i {
            font-size: 1.8rem;
            color: var(--acento);
            text-shadow: 0 2px 8px rgba(253, 203, 110, 0.5);
            animation: aparecerEstrella 0.4s ease backwards;
        }

        .victoria-estrellas i:nth-child(1) { animation-delay: 0.2s; }
        .victoria-estrellas i:nth-child(2) { animation-delay: 0.35s; }
        .victoria-estrellas i:nth-child(3) { animation-delay: 0.5s; }
        .victoria-estrellas i:nth-child(4) { animation-delay: 0.65s; }
        .victoria-estrellas i:nth-child(5) { animation-delay: 0.8s; }
        .victoria-estrellas i:nth-child(6) { animation-delay: 0.95s; }
        .victoria-estrellas i:nth-child(7) { animation-delay: 1.1s; }
        .victoria-estrellas i:nth-child(8) { animation-delay: 1.25s; }
        .victoria-estrellas i:nth-child(9) { animation-delay: 1.4s; }
        .victoria-estrellas i:nth-child(10) { animation-delay: 1.55s; }

        @keyframes aparecerEstrella {
            from { transform: scale(0) rotate(-30deg); opacity: 0; }
            to { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .btn-reiniciar {
            font-family: 'Fredoka One', cursive;
            font-size: 1.2rem;
            color: white;
            background: linear-gradient(135deg, var(--primario), #FF8A5C);
            border: none;
            border-radius: 16px;
            padding: 16px 40px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(255, 107, 53, 0.35);
        }

        .btn-reiniciar:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(255, 107, 53, 0.45);
        }

        .btn-reiniciar:active { transform: translateY(0); }

        .confeti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 101;
        }

        .particula {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 50;
            animation: explotar 0.7s ease-out forwards;
        }

        @keyframes explotar {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }

        .inicio-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #FFF8E7 0%, #FFECD2 50%, #FCE4C8 100%);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity 0.5s, transform 0.5s;
        }

        .inicio-overlay.ocultar {
            opacity: 0;
            transform: scale(1.1);
            pointer-events: none;
        }

        .inicio-card { text-align: center; max-width: 420px; }

        .inicio-logo {
            font-size: 5rem;
            margin-bottom: 16px;
            display: block;
            animation: rebotar 1.5s ease infinite;
        }

        .inicio-titulo {
            font-family: 'Fredoka One', cursive;
            font-size: 2.2rem;
            color: var(--primario);
            margin-bottom: 8px;
        }

        .inicio-desc {
            font-size: 1.05rem;
            color: var(--texto-claro);
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .inicio-nombre {
            font-family: 'Fredoka One', cursive;
            font-size: 1.3rem;
            color: var(--secundario);
            margin-bottom: 28px;
        }

        .btn-empezar {
            font-family: 'Fredoka One', cursive;
            font-size: 1.3rem;
            color: white;
            background: linear-gradient(135deg, var(--secundario), #00D2A0);
            border: none;
            border-radius: 18px;
            padding: 18px 48px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 6px 20px rgba(0, 184, 148, 0.35);
        }

        .btn-empezar:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 10px 28px rgba(0, 184, 148, 0.45);
        }

        .btn-empezar:active { transform: translateY(0) scale(0.98); }

        .dificultad-tag {
            display: inline-block;
            background: linear-gradient(135deg, var(--primario), #FF8A5C);
            color: white;
            font-family: 'Fredoka One', cursive;
            font-size: 0.8rem;
            padding: 4px 14px;
            border-radius: 20px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        @media (max-width: 480px) {
            .titulo { font-size: 1.6rem; }
            .pregunta { font-size: 2.8rem; }
            .opcion { font-size: 1.3rem; padding: 14px 10px; }
            .tarjeta { padding: 28px 20px 24px; }
            .victoria-titulo { font-size: 1.4rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <div class="fondo-formas" aria-hidden="true">
        <div class="forma"></div>
        <div class="forma"></div>
        <div class="forma"></div>
        <div class="forma"></div>
        <div class="forma"></div>
    </div>

    <div class="inicio-overlay" id="pantallaInicio" role="dialog" aria-label="Pantalla de inicio">
        <div class="inicio-card">
            <span class="inicio-logo" aria-hidden="true"><i class="fas fa-calculator" style="color:var(--primario)"></i></span>
            <div class="inicio-titulo">Multiplicaciones</div>
            <div class="inicio-desc">Acierta 10 multiplicaciones seguidas<br>para ganar a la maquina</div>
            <div class="dificultad-tag">Nivel: del 2 al 9</div>
            <div class="inicio-nombre">Vamos, David!</div>
            <button class="btn-empezar" id="btnEmpezar" aria-label="Empezar el juego">
                <i class="fas fa-play"></i> Empezar
            </button>
        </div>
    </div>

    <main class="contenedor" id="juego">
        <h1 class="titulo">Multiplicaciones</h1>
        <p class="subtitulo">Acierta 10 para ganar, David</p>

        <div class="barra-contenedor">
            <div class="barra-info">
                <span class="barra-label"><i class="fas fa-trophy"></i> Progreso</span>
                <span class="barra-numero" id="barraTexto">0 / 10</span>
            </div>
            <div class="barra-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="10">
                <div class="barra-fill" id="barraFill"></div>
            </div>
            <div class="estrellas" id="estrellas" aria-hidden="true">
                <i class="fas fa-star estrella"></i>
                <i class="fas fa-star estrella"></i>
                <i class="fas fa-star estrella"></i>
                <i class="fas fa-star estrella"></i>
                <i class="fas fa-star estrella"></i>
                <i class="fas fa-star estrella"></i>
                <i class="fas fa-star estrella"></i>
                <i class="fas fa-star estrella"></i>
                <i class="fas fa-star estrella"></i>
                <i class="fas fa-star estrella"></i>
            </div>
        </div>

        <div class="tarjeta" id="tarjeta">
            <div class="pregunta-label">Cuanto es</div>
            <div class="pregunta" id="pregunta">
                <span id="num1">-</span>
                <span class="signo">&times;</span>
                <span id="num2">-</span>
                <span class="igual">=</span>
                <span class="interrogacion">?</span>
            </div>
            <div class="opciones" id="opciones">
                <button class="opcion" aria-label="Opción 1">
                    <span class="opcion-num">-</span>
                    <span class="icono-resultado"></span>
                </button>
                <button class="opcion" aria-label="Opción 2">
                    <span class="opcion-num">-</span>
                    <span class="icono-resultado"></span>
                </button>
                <button class="opcion" aria-label="Opción 3">
                    <span class="opcion-num">-</span>
                    <span class="icono-resultado"></span>
                </button>
                <button class="opcion" aria-label="Opción 4">
                    <span class="opcion-num">-</span>
                    <span class="icono-resultado"></span>
                </button>
            </div>
            <div class="feedback" id="feedback"></div>
            <div class="racha" id="racha"></div>
            <div class="contador-errores" id="contadorErrores"></div>
        </div>
    </main>

    <div class="victoria-overlay" id="pantallaVictoria" role="dialog" aria-label="Pantalla de victoria">
        <div class="victoria-card">
            <span class="victoria-icono" aria-hidden="true"><i class="fas fa-trophy" style="color:var(--acento)"></i></span>
            <div class="victoria-titulo">Has ganado a la maquina,<br>David!</div>
            <div class="victoria-sub">10 multiplicaciones acertadas</div>
            <div class="victoria-estrellas" aria-hidden="true">
                <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i>
                <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i>
                <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i>
                <i class="fas fa-star"></i>
            </div>
            <button class="btn-reiniciar" id="btnReiniciar" aria-label="Volver a empezar">
                <i class="fas fa-redo"></i> Volver a empezar
            </button>
        </div>
    </div>

    <canvas class="confeti-canvas" id="confetiCanvas"></canvas>

    <script>
        // --- Estado del juego ---
        var aciertos = 0;
        var errores = 0;
        var rachaActual = 0;
        var respondiendo = false;

        // --- Referencias DOM ---
        var pantallaInicio = document.getElementById('pantallaInicio');
        var btnEmpezar = document.getElementById('btnEmpezar');
        var num1El = document.getElementById('num1');
        var num2El = document.getElementById('num2');
        var opcionesEl = document.getElementById('opciones');
        var opcionBtns = opcionesEl.querySelectorAll('.opcion');
        var opcionNums = opcionesEl.querySelectorAll('.opcion-num');
        var opcionIconos = opcionesEl.querySelectorAll('.icono-resultado');
        var barraFill = document.getElementById('barraFill');
        var barraTexto = document.getElementById('barraTexto');
        var estrellas = document.querySelectorAll('.estrella');
        var feedback = document.getElementById('feedback');
        var rachaEl = document.getElementById('racha');
        var contadorErrores = document.getElementById('contadorErrores');
        var tarjeta = document.getElementById('tarjeta');
        var pantallaVictoria = document.getElementById('pantallaVictoria');
        var btnReiniciar = document.getElementById('btnReiniciar');
        var confetiCanvas = document.getElementById('confetiCanvas');
        var ctx = confetiCanvas.getContext('2d');

        var frasesBien = [
            'Genial, David!', 'Muy bien!', 'Asi se hace!',
            'Perfecto!', 'Increible!', 'Brillante!',
            'Fantastico!', 'Eres una maquina!', 'Sin fallos!', 'Que cerebro!'
        ];

        var frasesMal = [
            'Casi lo tienes!', 'Intentalo de nuevo!',
            'No pasa nada, sigue!', 'El siguiente sera!', 'Venga, tu puedes!'
        ];

        // --- Numero aleatorio del 2 al 9 (sin 1 ni 10) ---
        function numAleatorio() {
            return Math.floor(Math.random() * 8) + 2; // 2,3,4,5,6,7,8,9
        }

        // --- Generar pregunta ---
        function generarPregunta() {
            var a = numAleatorio();
            var b = numAleatorio();
            var correcta = a * b;

            num1El.textContent = a;
            num2El.textContent = b;

            // Generar 3 incorrectas con offsets seguros
            var incorrectas = [];
            var offsets = [-8, -7, -6, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 6, 7, 8, -a, a, -b, b, -a - b, a + b];

            // Barajar offsets
            for (var i = offsets.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = offsets[i];
                offsets[i] = offsets[j];
                offsets[j] = temp;
            }

            // Coger los primeros válidos
            for (var k = 0; k < offsets.length && incorrectas.length < 3; k++) {
                var falsa = correcta + offsets[k];
                if (falsa > 0 && falsa !== correcta && incorrectas.indexOf(falsa) === -1) {
                    incorrectas.push(falsa);
                }
            }

            // Relleno de emergencia
            var extra = 1;
            while (incorrectas.length < 3) {
                if (extra !== correcta && incorrectas.indexOf(extra) === -1) {
                    incorrectas.push(extra);
                }
                extra++;
            }

            // Mezclar las 4 opciones
            var opciones = [correcta, incorrectas[0], incorrectas[1], incorrectas[2]];
            for (var i = opciones.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = opciones[i];
                opciones[i] = opciones[j];
                opciones[j] = temp;
            }

            // Asignar a los botones
            for (var i = 0; i < 4; i++) {
                opcionNums[i].textContent = opciones[i];
                opcionBtns[i].dataset.valor = opciones[i];
                opcionBtns[i].className = 'opcion';
                opcionIconos[i].innerHTML = '';
                opcionIconos[i].style.display = 'none';
            }
        }

        // --- Actualizar progreso ---
        function actualizarProgreso() {
            var porcentaje = (aciertos / 10) * 100;
            barraFill.style.width = porcentaje + '%';
            barraTexto.textContent = aciertos + ' / 10';

            for (var i = 0; i < estrellas.length; i++) {
                if (i < aciertos) {
                    estrellas[i].classList.add('conseguida');
                } else {
                    estrellas[i].classList.remove('conseguida');
                }
            }
        }

        // --- Feedback ---
        function mostrarFeedback(esCorrecta) {
            feedback.classList.remove('visible', 'bien', 'mal');

            if (esCorrecta) {
                var frase = frasesBien[Math.floor(Math.random() * frasesBien.length)];
                feedback.innerHTML = '<i class="fas fa-check-circle"></i> ' + frase;
                feedback.classList.add('bien');
            } else {
                var frase = frasesMal[Math.floor(Math.random() * frasesMal.length)];
                feedback.innerHTML = '<i class="fas fa-times-circle"></i> ' + frase;
                feedback.classList.add('mal');
            }

            void feedback.offsetWidth;
            feedback.classList.add('visible');
        }

        // --- Racha ---
        function actualizarRacha() {
            if (rachaActual >= 2) {
                rachaEl.innerHTML = '<i class="fas fa-fire"></i> Racha de ' + rachaActual + ' aciertos!';
                rachaEl.classList.add('visible');
            } else {
                rachaEl.classList.remove('visible');
            }
        }

        // --- Errores ---
        function actualizarErrores() {
            contadorErrores.textContent = errores > 0 ? 'Errores: ' + errores : '';
        }

        // --- Partículas ---
        function crearParticulas(btn) {
            var rect = btn.getBoundingClientRect();
            var cx = rect.left + rect.width / 2;
            var cy = rect.top + rect.height / 2;
            var colores = ['#FF6B35', '#00B894', '#FDCB6E', '#E17055', '#00D2A0'];

            for (var i = 0; i < 12; i++) {
                var p = document.createElement('div');
                p.className = 'particula';
                var angle = (Math.PI * 2 / 12) * i + Math.random() * 0.5;
                var dist = 40 + Math.random() * 60;
                var dx = Math.cos(angle) * dist;
                var dy = Math.sin(angle) * dist;
                var size = 6 + Math.random() * 8;
                p.style.cssText = 'left:' + cx + 'px;top:' + cy + 'px;width:' + size + 'px;height:' + size + 'px;background:' + colores[Math.floor(Math.random() * colores.length)] + ';--dx:' + dx + 'px;--dy:' + dy + 'px;';
                document.body.appendChild(p);
                (function(el) {
                    setTimeout(function() { el.remove(); }, 700);
                })(p);
            }
        }

        // --- Click en opción ---
        function handleClickOpcion(indice) {
            if (respondiendo) return;
            respondiendo = true;

            var btn = opcionBtns[indice];
            var valorElegido = parseInt(btn.dataset.valor);
            var a = parseInt(num1El.textContent);
            var b = parseInt(num2El.textContent);
            var correcta = a * b;
            var esCorrecta = (valorElegido === correcta);

            for (var i = 0; i < 4; i++) {
                opcionBtns[i].classList.add('desactivada');
            }

            if (esCorrecta) {
                btn.classList.remove('desactivada');
                btn.classList.add('elegida-correcta');
                opcionIconos[indice].innerHTML = '<i class="fas fa-check"></i>';
                opcionIconos[indice].style.display = 'inline';
                tarjeta.classList.add('correcta');
                crearParticulas(btn);
                aciertos++;
                rachaActual++;
                actualizarProgreso();
                mostrarFeedback(true);
                actualizarRacha();

                if (aciertos >= 10) {
                    setTimeout(function() { mostrarVictoria(); }, 1000);
                    return;
                }

                setTimeout(function() {
                    tarjeta.classList.remove('correcta');
                    generarPregunta();
                    respondiendo = false;
                }, 1200);

            } else {
                btn.classList.add('elegida-incorrecta');
                opcionIconos[indice].innerHTML = '<i class="fas fa-times"></i>';
                opcionIconos[indice].style.display = 'inline';
                tarjeta.classList.add('incorrecta');
                errores++;
                rachaActual = 0;
                mostrarFeedback(false);
                actualizarRacha();
                actualizarErrores();

                for (var j = 0; j < 4; j++) {
                    if (parseInt(opcionBtns[j].dataset.valor) === correcta) {
                        opcionBtns[j].classList.remove('desactivada');
                        opcionBtns[j].classList.add('mostrar-correcta');
                        opcionIconos[j].innerHTML = '<i class="fas fa-check" style="color:var(--secundario)"></i>';
                        opcionIconos[j].style.display = 'inline';
                    }
                }

                setTimeout(function() {
                    tarjeta.classList.remove('incorrecta');
                    generarPregunta();
                    respondiendo = false;
                }, 1800);
            }
        }

        // Asignar eventos
        for (var i = 0; i < opcionBtns.length; i++) {
            (function(idx) {
                opcionBtns[idx].addEventListener('click', function() {
                    handleClickOpcion(idx);
                });
            })(i);
        }

        // --- Confeti ---
        var confetiActivado = false;
        var confetis = [];

        function redimensionarCanvas() {
            confetiCanvas.width = window.innerWidth;
            confetiCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', redimensionarCanvas);
        redimensionarCanvas();

        function crearConfeti() {
            var colores = ['#FF6B35', '#00B894', '#FDCB6E', '#E17055', '#00D2A0', '#FF9F43', '#6C5CE7', '#FD79A8'];
            for (var i = 0; i < 150; i++) {
                confetis.push({
                    x: Math.random() * confetiCanvas.width,
                    y: Math.random() * confetiCanvas.height - confetiCanvas.height,
                    w: 6 + Math.random() * 8,
                    h: 4 + Math.random() * 6,
                    color: colores[Math.floor(Math.random() * colores.length)],
                    vy: 2 + Math.random() * 4,
                    vx: -2 + Math.random() * 4,
                    rot: Math.random() * 360,
                    rv: -4 + Math.random() * 8,
                    op: 1
                });
            }
        }

        function animarConfeti() {
            if (!confetiActivado) return;
            ctx.clearRect(0, 0, confetiCanvas.width, confetiCanvas.height);

            var vivos = 0;
            for (var i = 0; i < confetis.length; i++) {
                var c = confetis[i];
                c.y += c.vy;
                c.x += c.vx;
                c.rot += c.rv;
                if (c.y > confetiCanvas.height - 100) c.op -= 0.02;
                if (c.op > 0) {
                    vivos++;
                    ctx.save();
                    ctx.translate(c.x, c.y);
                    ctx.rotate(c.rot * Math.PI / 180);
                    ctx.globalAlpha = Math.max(0, c.op);
                    ctx.fillStyle = c.color;
                    ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
                    ctx.restore();
                }
            }

            if (vivos > 0) {
                requestAnimationFrame(animarConfeti);
            } else {
                confetiActivado = false;
                ctx.clearRect(0, 0, confetiCanvas.width, confetiCanvas.height);
            }
        }

        function lanzarConfeti() {
            confetis = [];
            crearConfeti();
            confetiActivado = true;
            animarConfeti();
        }

        // --- Victoria ---
        function mostrarVictoria() {
            pantallaVictoria.classList.add('mostrar');
            lanzarConfeti();
        }

        // --- Reiniciar ---
        function reiniciarJuego() {
            pantallaVictoria.classList.remove('mostrar');
            aciertos = 0;
            errores = 0;
            rachaActual = 0;
            respondiendo = false;
            feedback.classList.remove('visible', 'bien', 'mal');
            rachaEl.classList.remove('visible');
            contadorErrores.textContent = '';
            tarjeta.classList.remove('correcta', 'incorrecta');
            actualizarProgreso();
            generarPregunta();
        }

        btnReiniciar.addEventListener('click', reiniciarJuego);

        // --- Inicio ---
        btnEmpezar.addEventListener('click', function() {
            pantallaInicio.classList.add('ocultar');
            setTimeout(function() {
                pantallaInicio.style.display = 'none';
            }, 500);
            generarPregunta();
        });

        actualizarProgreso();
    </script>
</body>
</html>
